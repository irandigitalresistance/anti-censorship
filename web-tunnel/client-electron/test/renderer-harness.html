<!doctype html>
<html lang="en">
<!--
  Browser-loadable harness for the client-electron renderer. Provides a
  mock `window.wt` so the same HTML/CSS/JS can be driven without Electron
  or a live Bale session. Used by the Playwright E2E test.

  What it exercises:
   - Carrier radio switch (chat | webrtc) toggles the correct option blocks
   - WebRTC option is enabled when caps.hasWebrtc=true, disabled otherwise
   - Start-tunnel calls the right startTunnel({carrier,...}) shape
-->
<head>
  <meta charset="utf-8" />
  <title>renderer harness</title>
  <script>
    // --- Mock IPC surface identical to preload.cjs ---
    const calls = { startTunnel: [], stopTunnel: 0 };
    let capsOverride = null;
    const fakeStatus = {
      loginStage: 'ready',
      pendingPhone: null,
      me: { id: 42, name: 'Test User', phone: null },
      tunnel: null,
      lastError: null,
    };
    const subscribers = new Set();
    window.wt = {
      getCaps: async () => capsOverride ?? { hasWebrtc: true },
      getStatus: async () => JSON.parse(JSON.stringify(fakeStatus)),
      sendPhoneCode: async () => {},
      resendCode: async () => {},
      verifyCode: async () => {},
      verifyPassword: async () => {},
      backToPhone: async () => {},
      backToCode: async () => {},
      signOut: async () => {},
      listChats: async () => [
        { chat_id: 10001, chat_type: 'PRIVATE', title: 'Test Server Account', username: 'wt_server', unread: 0, last_message: null },
        { chat_id: 20002, chat_type: 'PRIVATE', title: 'Friend', username: null, unread: 3, last_message: 'hey' },
      ],
      startTunnel: async (opts) => {
        calls.startTunnel.push(opts);
        fakeStatus.tunnel = {
          carrier: opts.carrier ?? 'chat',
          peer: opts.peer ?? { chatId: 0, chatType: 'PRIVATE' },
          serverLabel: opts.serverLabel ?? null,
          socksPort: opts.socksPort ?? 1080,
          startedAt: Date.now(),
          bytesUp: 0, bytesDown: 0, streamsOpened: 0, streamsActive: 0,
        };
        for (const cb of subscribers) cb(JSON.parse(JSON.stringify(fakeStatus)));
        return { socksPort: fakeStatus.tunnel.socksPort };
      },
      stopTunnel: async () => {
        calls.stopTunnel++;
        fakeStatus.tunnel = null;
        for (const cb of subscribers) cb(JSON.parse(JSON.stringify(fakeStatus)));
      },
      onStatusChange: (cb) => {
        subscribers.add(cb);
        return () => subscribers.delete(cb);
      },
    };
    // Test hooks for the harness (accessed by Playwright via evaluate).
    window.__harness = {
      calls,
      setCaps: (caps) => { capsOverride = caps; },
      getStatus: () => JSON.parse(JSON.stringify(fakeStatus)),
    };
  </script>
  <!-- Reuse the renderer's styles by inlining the same sheet. -->
  <style>
    :root {
      --bg: #0e0f12; --panel: #161922; --text: #e6e8ee; --muted: #8a90a1;
      --accent: #4cd4a3; --warn: #f4a056; --err: #e45656; --border: #232736;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 13px/1.45 ui-monospace, Menlo, monospace; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    main { flex: 1; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
    .card h2 { margin: 0 0 10px; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    label { display: block; margin: 6px 0 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    input, select, button { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; width: 100%; }
    button { cursor: pointer; width: auto; padding: 8px 18px; }
    button.primary { background: var(--accent); color: #08211a; border-color: var(--accent); font-weight: 500; }
    .row { display: flex; gap: 12px; align-items: flex-end; }
    .row > * { flex: 1; }
    .row > button { flex: 0 0 auto; }
    .step-sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
    code { background: var(--bg); padding: 2px 5px; border-radius: 3px; font-size: 11px; border: 1px solid var(--border); }
    .muted { color: var(--muted); }
    .kpi { display: flex; gap: 22px; flex-wrap: wrap; }
    .kpi .item strong { display: block; font-size: 20px; color: var(--text); font-weight: 500; }
    .kpi .item span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0;font-size:14px;">web-tunnel (harness)</h1>
    <div id="me" class="muted" style="margin-left:auto;">not logged in</div>
  </header>
  <main>
    <div id="picker" class="card" data-testid="picker-card">
      <h2>Start a tunnel</h2>

      <label>Carrier</label>
      <div id="carrier-switch" style="display:flex; gap:18px; margin-bottom:10px; align-items:center;">
        <label style="display:inline-flex; align-items:center; gap:6px; width:auto; color:var(--text); text-transform:none; letter-spacing:0; font-size:12px; margin:0;">
          <input type="radio" name="carrier" value="chat" id="carrier-chat" checked style="width:auto; margin:0;" data-testid="radio-chat" />
          <span>Chat (Bale messages) <span class="muted" style="font-size:11px;">— reliable, slow</span></span>
        </label>
        <label style="display:inline-flex; align-items:center; gap:6px; width:auto; color:var(--text); text-transform:none; letter-spacing:0; font-size:12px; margin:0;" id="carrier-webrtc-label">
          <input type="radio" name="carrier" value="webrtc" id="carrier-webrtc" style="width:auto; margin:0;" data-testid="radio-webrtc" />
          <span>WebRTC (LiveKit) <span class="muted" style="font-size:11px;" id="webrtc-hint">— fast, requires LiveKit</span></span>
        </label>
      </div>

      <div id="chat-carrier-opts" data-testid="chat-opts">
        <label for="chat-select">Chat to use as carrier (server's Bale account)</label>
        <select id="chat-select" data-testid="chat-select"><option value="">— loading chats —</option></select>
      </div>

      <div id="webrtc-carrier-opts" style="display:none;" data-testid="webrtc-opts">
        <div class="step-sub" style="margin:8px 0 0;">
          The server and client will meet in a LiveKit room whose name is derived
          deterministically from your shared password.
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div>
          <label for="tunnel-password">Shared password</label>
          <input id="tunnel-password" type="text" data-testid="password" />
        </div>
        <div style="max-width:110px;">
          <label for="socks-port">SOCKS5 port</label>
          <input id="socks-port" type="number" value="1080" data-testid="socks-port" />
        </div>
        <button id="start" class="primary" data-testid="start">Start tunnel</button>
      </div>
    </div>

    <div id="connected" class="card" style="display:none;" data-testid="connected-card">
      <h2>Tunnel active</h2>
      <div class="kpi">
        <div class="item"><strong id="k-server" data-testid="k-server">—</strong><span>Server</span></div>
        <div class="item"><strong id="k-socks">—</strong><span>SOCKS5</span></div>
      </div>
      <button id="stop" style="margin-top:10px;">Stop</button>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function selectedCarrier() {
      return document.querySelector('input[name="carrier"]:checked')?.value ?? 'chat';
    }
    function applyCarrierUI() {
      const c = selectedCarrier();
      $('chat-carrier-opts').style.display = c === 'chat' ? 'block' : 'none';
      $('webrtc-carrier-opts').style.display = c === 'webrtc' ? 'block' : 'none';
    }
    document.querySelectorAll('input[name="carrier"]').forEach((el) => {
      el.addEventListener('change', applyCarrierUI);
    });

    async function applyCaps() {
      const caps = await window.wt.getCaps();
      const rb = $('carrier-webrtc');
      const hint = $('webrtc-hint');
      if (!caps.hasWebrtc) {
        rb.disabled = true;
        hint.textContent = '— unavailable (set WT_LIVEKIT_MODE to enable)';
        if (rb.checked) { $('carrier-chat').checked = true; applyCarrierUI(); }
      } else {
        rb.disabled = false;
        hint.textContent = '— fast, requires LiveKit';
      }
    }

    async function loadChats() {
      const chats = await window.wt.listChats();
      const sel = $('chat-select');
      sel.innerHTML = '';
      for (const d of chats) {
        const o = document.createElement('option');
        o.value = JSON.stringify({ chatId: d.chat_id, chatType: d.chat_type });
        o.textContent = d.title;
        sel.appendChild(o);
      }
    }

    function renderStatus(status) {
      if (status.tunnel) {
        $('picker').style.display = 'none';
        $('connected').style.display = 'block';
        const label = status.tunnel.serverLabel ?? 'server';
        $('k-server').textContent = label + ' (' + (status.tunnel.carrier === 'webrtc' ? 'WebRTC' : 'Chat') + ')';
        $('k-socks').textContent = '127.0.0.1:' + status.tunnel.socksPort;
      } else {
        $('picker').style.display = 'block';
        $('connected').style.display = 'none';
      }
    }

    $('start').addEventListener('click', async () => {
      const carrier = selectedCarrier();
      const password = $('tunnel-password').value;
      const socksPort = Number($('socks-port').value);
      if (!password) return alert('Enter the shared password');
      let peer = null, serverLabel = null;
      if (carrier === 'chat') {
        const sel = $('chat-select');
        if (!sel.value) return alert('Pick a chat');
        peer = JSON.parse(sel.value);
        serverLabel = sel.options[sel.selectedIndex].textContent;
      } else {
        serverLabel = 'webrtc-room';
      }
      await window.wt.startTunnel({ carrier, peer, password, socksPort, serverLabel });
    });

    $('stop').addEventListener('click', async () => { await window.wt.stopTunnel(); });

    window.wt.onStatusChange(renderStatus);
    (async () => { applyCarrierUI(); await applyCaps(); await loadChats(); renderStatus(await window.wt.getStatus()); })();
  </script>
</body>
</html>
