[project]
name = "rl-dpi-agent"
version = "0.1.0"
description = "RL agents that learn to bypass an Iran-mimic DPI simulator"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.2",
    "tensorboard>=2.16",
    "pyyaml>=6.0",
    "scapy>=2.5",
    "dpkt>=1.9",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"
